name: iOS IPA (Sideload)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get
      
    - name: Build iOS (No Codesign)
      run: flutter build ios --release --no-codesign

    - name: Install ldid
      run: brew install ldid

    - name: Prepare App for Sideloading
      run: |
        APP_PATH="build/ios/iphoneos/Runner.app"
        
        # Remove existing code signature completely
        codesign --remove-signature "$APP_PATH/Runner" || true
        codesign --remove-signature "$APP_PATH" || true
        rm -rf "$APP_PATH/_CodeSignature"
        
        # Remove signatures from all frameworks
        find "$APP_PATH/Frameworks" -name "*.framework" -exec rm -rf {}/_CodeSignature \; 2>/dev/null || true
        find "$APP_PATH/Frameworks" -name "*.dylib" -exec codesign --remove-signature {} \; 2>/dev/null || true
        
        # Use ldid to pseudo-sign the main binary with empty entitlements
        ldid -S "$APP_PATH/Runner"
        
        # Sign all frameworks with ldid too
        find "$APP_PATH/Frameworks" -name "*.framework" -exec sh -c 'ldid -S "$1/$(basename "$1" .framework)"' _ {} \; 2>/dev/null || true
        
    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -R build/ios/iphoneos/Runner.app Payload/
        zip -r -q pms2_ott.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: pms2-ott-ios-sideload
        path: pms2_ott.ipa
