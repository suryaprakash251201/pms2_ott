name: PMS2 OTT CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    
    - name: Enable Windows support
      run: flutter config --enable-windows-desktop

    - name: Get dependencies
      run: flutter pub get
      
    - name: Build Windows Release
      run: flutter build windows --release

    - name: Upload Windows Exe
      uses: actions/upload-artifact@v3
      with:
        name: pms2-ott-windows
        path: build/windows/x64/runner/Release/pms2_ott.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    # Ensure local.properties doesn't interfere or is mocked if needed
    # But usually flutter build command handles SDK location on CI
      
    - name: Build APK Release
      run: flutter build apk --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: pms2-ott-android
        path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA (Sideload)
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get
      
    - name: Build iOS (No Codesign)
      run: flutter build ios --release --no-codesign

    - name: Create IPA Payload
      run: |
        mkdir -p Payload
        mv build/ios/iphoneos/Runner.app Payload/
        zip -r pms2_ott.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: pms2-ott-ios-sideload
        path: pms2_ott.ipa
